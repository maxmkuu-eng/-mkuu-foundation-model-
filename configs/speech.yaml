speech:
  enabled_by_default: false
  architecture: modular_asr_plus_text_model_plus_tts
  budget: free_and_open_source_only
  input:
    required: true
    tasks:
      - speech_to_text
      - language_identification
      - punctuation
      - sw_tz_slang_and_swanglish_transcription
      - regional_accent_evaluation
    status: not_implemented
  output:
    required: true
    engine: espeak-ng
    adapter: speech/tts_espeak.py
    language_voice: sw
    default_speed_words_per_minute: 155
    tasks:
      - text_to_speech
      - swahili_speech_synthesis
      - adjustable_speaking_rate
      - wav_file_output
      - direct_host_playback
    status: implemented_baseline_requires_espeak_ng
    quality_note: synthetic_voice_not_yet_validated_for_tanzanian_pronunciation
  privacy:
    explicit_microphone_permission: true
    recording_indicator: true
    retain_raw_audio_by_default: false
  provider_policy:
    paid_api_dependencies: false
    provider_neutral_interfaces: true
    require_license_review: true
  platform_limitations:
    python_adapter_requires_espeak_ng_cli: true
    android_app_integration: not_implemented
  status: partial_tts_implemented_asr_pending

model:
  vocab_size: 512
  d_model: 128
  n_layers: 2
  n_heads: 4
  ffn_hidden_size: 352
  max_seq_len: 256
  dropout: 0.0
  tie_embeddings: false
  rope_theta: 10000.0

training:
  seed: 42
  sequence_length: 128
  batch_size: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  max_steps: 5
  save_every: 5

name: MKUU corpus smoke training

on:
  workflow_dispatch:
  push:
    branches:
      - foundation-model-smoke-training
    paths:
      - ".github/workflows/smoke-training.yml"
      - "training/**"
      - "model/**"
      - "scripts/evaluate.py"
      - "configs/model_tiny_smoke.yaml"

permissions:
  contents: read
  actions: read

concurrency:
  group: mkuu-corpus-smoke-training
  cancel-in-progress: false

jobs:
  smoke-training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "numpy>=1.26" "sentencepiece>=0.2.0" "PyYAML>=6.0" "pytest>=8.0"

      - name: Download approved corpus artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: restore-swahili-corpus.yml
          workflow_conclusion: success
          branch: foundation-model-smoke-training
          name: mkuu-swahili-corpus-review-candidate
          path: output
          if_no_artifact_found: fail

      - name: Validate corpus files and tokenizer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sentencepiece as spm
          root = Path("output")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("training_approved") is True
          assert manifest.get("license_status") == "approved"
          for split in ("train", "validation", "test"):
              path = root / "splits" / f"{split}.jsonl"
              assert path.is_file() and path.stat().st_size > 0, f"Missing {split} split"
              with path.open(encoding="utf-8") as f:
                  count = sum(1 for line in f if line.strip())
              assert count == manifest["split_counts"][split], f"{split} count mismatch"
          tokenizer = spm.SentencePieceProcessor(model_file=str(root / "mkuu_swahili_spm.model"))
          assert tokenizer.get_piece_size() == manifest["tokenizer_vocab_size"]
          print("Corpus approval, split counts and tokenizer verified.")
          print(json.dumps(manifest["split_counts"], indent=2))
          print("Tokenizer vocabulary:", tokenizer.get_piece_size())
          PY

      - name: Create bounded real-corpus smoke samples
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("output/splits")
          limits = {"train": 512, "validation": 128, "test": 128}
          for split, limit in limits.items():
              source = root / f"{split}.jsonl"
              target = root / f"{split}_smoke.jsonl"
              with source.open(encoding="utf-8") as src, target.open("w", encoding="utf-8") as dst:
                  for index, line in enumerate(src):
                      if index >= limit:
                          break
                      dst.write(line)
              if target.stat().st_size == 0:
                  raise SystemExit(f"Smoke sample is empty: {split}")
              print(f"{split}: {min(limit, index + 1)} sampled records")
          PY

      - name: Build tiny smoke-training configuration
        run: |
          python - <<'PY'
          import yaml
          import sentencepiece as spm
          from pathlib import Path
          cfg = yaml.safe_load(Path("configs/model_tiny_smoke.yaml").read_text(encoding="utf-8"))
          cfg["model"]["vocab_size"] = spm.SentencePieceProcessor(
              model_file="output/mkuu_swahili_spm.model"
          ).get_piece_size()
          cfg["training"].update({
              "sequence_length": 128,
              "batch_size": 1,
              "gradient_accumulation_steps": 1,
              "learning_rate": 0.00002,
              "warmup_steps": 1,
              "max_steps": 5,
              "save_every": 5,
              "log_every": 1,
              "num_workers": 0
          })
          Path("output/smoke_config.yaml").write_text(
              yaml.safe_dump(cfg, sort_keys=False), encoding="utf-8"
          )
          print(yaml.safe_dump(cfg, sort_keys=False))
          PY

      - name: Run five-step CPU pretraining smoke test
        run: |
          python training/pretrain.py \
            --config output/smoke_config.yaml \
            --data output/splits/train_smoke.jsonl \
            --tokenizer output/mkuu_swahili_spm.model \
            --output output/smoke-checkpoint

      - name: Evaluate smoke checkpoint on validation and test
        run: |
          python scripts/evaluate.py \
            --checkpoint output/smoke-checkpoint/last.pt \
            --tokenizer output/mkuu_swahili_spm.model \
            --data output/splits/validation_smoke.jsonl \
            --split validation
          python scripts/evaluate.py \
            --checkpoint output/smoke-checkpoint/last.pt \
            --tokenizer output/mkuu_swahili_spm.model \
            --data output/splits/test_smoke.jsonl \
            --split test

      - name: Upload smoke-training evidence
        uses: actions/upload-artifact@v4
        with:
          name: mkuu-foundation-smoke-training
          path: |
            output/smoke_config.yaml
            output/smoke-checkpoint/last.pt
          if-no-files-found: error
          retention-days: 30

name: MKUU model checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Run end-to-end CPU training smoke test
        run: python scripts/smoke_train.py
      - name: Report configured parameter count
        run: python scripts/print_model_size.py --config configs/model_300m.yaml
